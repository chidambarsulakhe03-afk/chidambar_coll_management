<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Students | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-mark"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="brand-text">Student<br/>Management</div>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Sidebar navigation">
          <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
          <a href="students.html" class="sidebar-link"><i class="bi bi-people-fill"></i><span>Students</span></a>
          <a href="add-student.html" class="sidebar-link"><i class="bi bi-person-plus-fill"></i><span>Add Student</span></a>
          <a href="search.html" class="sidebar-link active"><i class="bi bi-search"></i><span>Search Students</span></a>
          <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i><span>Profile</span></a>
          <a href="settings.html" class="sidebar-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
          <a href="login.html" class="sidebar-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-pill">
            <div class="user-avatar">AD</div>
            <div class="user-meta">
              <strong>Admin</strong>
              <small>College Office</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-inner">
            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-light mobile-menu-btn" data-sidebar-toggle aria-label="Open menu">
                <i class="bi bi-list"></i>
              </button>
              <h1 class="page-title">Search Students</h1>
            </div>
            <div class="topbar-tools">
              <div class="user-pill">
                <div class="user-avatar">AD</div>
                <div class="user-meta">
                  <strong>Admin</strong>
                  <small>admin@college.edu</small>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="content-area">
          <section class="page-section search-panel">
            <div class="mb-3">
              <label for="searchPageInput" class="form-label">Search by name, Student ID, USN or email</label>
              <div class="search-box">
                <input id="searchPageInput" type="search" placeholder="Search by name, Student ID, USN or email" />
                <i class="bi bi-search"></i>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center gap-3 flex-wrap mb-3">
              <div class="d-flex align-items-center gap-2">
                <strong id="searchResultsCount">0 results</strong>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <select class="form-select" aria-label="Department filter" style="max-width: 180px;">
                  <option>All Departments</option>
                </select>
                <select class="form-select" aria-label="Semester filter" style="max-width: 160px;">
                  <option>All Semesters</option>
                </select>
                <button id="clearSearch" class="btn btn-light" type="button">Clear</button>
              </div>
            </div>

            <div id="searchResultsContainer" class="search-results"></div>
            <div id="searchEmptyState" class="empty-state d-none">
              <i class="bi bi-file-earmark-person"></i>
              <h5>No students found</h5>
              <p>Try adjusting your search or filters.</p>
            </div>
          </section>
        </div>
      </main>
    </div>

    <div class="sidebar-overlay"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
