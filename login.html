<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-layout">
      <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div>
        <h1 class="auth-heading">Welcome Back</h1>
        <p class="auth-subtitle">Sign in to manage your student records with confidence.</p>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email or Username</label>
            <input id="loginEmail" type="email" class="form-control" placeholder="Enter your email or username" required />
          </div>

          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <div class="password-wrap">
              <input id="loginPassword" type="password" class="form-control" placeholder="Enter your password" required />
              <button type="button" class="password-toggle" data-password-toggle data-target="loginPassword" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <label class="form-check mb-0">
              <input class="form-check-input" type="checkbox" />
              <span>Remember me</span>
            </label>
            <a href="#" class="text-primary">Forgot Password?</a>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
        </form>

        <div class="auth-links">
          <span>New here? <a href="register.html" class="text-primary fw-semibold">Create an account</a></span>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
