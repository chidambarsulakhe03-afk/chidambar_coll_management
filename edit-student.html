<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Student | Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="brand-mark"><i class="bi bi-mortarboard-fill"></i></div>
            <div class="brand-text">Student<br/>Management</div>
          </div>
        </div>

        <nav class="sidebar-nav" aria-label="Sidebar navigation">
          <a href="dashboard.html" class="sidebar-link"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></a>
          <a href="students.html" class="sidebar-link"><i class="bi bi-people-fill"></i><span>Students</span></a>
          <a href="add-student.html" class="sidebar-link"><i class="bi bi-person-plus-fill"></i><span>Add Student</span></a>
          <a href="search.html" class="sidebar-link"><i class="bi bi-search"></i><span>Search Students</span></a>
          <a href="profile.html" class="sidebar-link"><i class="bi bi-person-circle"></i><span>Profile</span></a>
          <a href="settings.html" class="sidebar-link"><i class="bi bi-gear-fill"></i><span>Settings</span></a>
          <a href="login.html" class="sidebar-link"><i class="bi bi-box-arrow-right"></i><span>Logout</span></a>
        </nav>

        <div class="sidebar-footer">
          <div class="user-pill">
            <div class="user-avatar">AD</div>
            <div class="user-meta">
              <strong>Admin</strong>
              <small>College Office</small>
            </div>
          </div>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="topbar-inner">
            <div class="d-flex align-items-center gap-3">
              <button class="btn btn-light mobile-menu-btn" data-sidebar-toggle aria-label="Open menu">
                <i class="bi bi-list"></i>
              </button>
              <h1 class="page-title">Edit Student</h1>
            </div>
            <div class="topbar-tools">
              <div class="user-pill">
                <div class="user-avatar">AD</div>
                <div class="user-meta">
                  <strong>Admin</strong>
                  <small>admin@college.edu</small>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="content-area">
          <div class="form-page">
            <form class="form-card" data-validate data-redirect="student-details.html" data-mode="edit" novalidate>
              <div class="section-header">
                <h2 class="mb-0">Student Information</h2>
              </div>

              <div class="form-grid">
                <div class="full-width">
                  <label class="form-label">Profile Photo</label>
                  <div class="input-file">
                    <div class="image-picker">
                      <div class="preview-box mb-3">
                        <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80" alt="Student portrait" style="width:100%; height:100%; object-fit:cover; border-radius:18px;" />
                      </div>
                      <div>Replace profile image</div>
                    </div>
                    <input type="file" accept="image/*" />
                  </div>
                </div>

                <div>
                  <label for="editFullName" class="form-label">Full Name</label>
                  <input id="editFullName" name="editFullName" type="text" class="form-control" value="Aarav Sharma" required />
                </div>

                <div>
                  <label for="editDob" class="form-label">Date of Birth</label>
                  <input id="editDob" name="editDob" type="date" class="form-control" value="2002-08-15" required />
                </div>

                <div>
                  <label for="editGender" class="form-label">Gender</label>
                  <select id="editGender" class="form-select" required>
                    <option value="Male" selected>Male</option>
                    <option value="Female">Female</option>
                  </select>
                </div>

                <div>
                  <label for="editPhone" class="form-label">Phone Number</label>
                  <input id="editPhone" name="editPhone" type="tel" class="form-control" value="+91 9876543210" required />
                </div>

                <div>
                  <label for="editStudentEmail" class="form-label">Email</label>
                  <input id="editStudentEmail" name="editStudentEmail" type="email" class="form-control" value="aarav.sharma@example.com" required />
                </div>

                <div>
                  <label for="editStudentId" class="form-label">Student ID</label>
                  <input id="editStudentId" name="editStudentId" type="text" class="form-control" value="STU-2024-101" required />
                </div>

                <div>
                  <label for="editUsn" class="form-label">USN / Roll Number</label>
                  <input id="editUsn" name="editUsn" type="text" class="form-control" value="1MS20CS001" required />
                </div>

                <div>
                  <label for="editDepartment" class="form-label">Department</label>
                  <select id="editDepartment" class="form-select" required>
                    <option value="Computer Science" selected>Computer Science</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Mechanical">Mechanical</option>
                    <option value="Civil">Civil</option>
                    <option value="Electrical">Electrical</option>
                    <option value="Information Technology">Information Technology</option>
                    <option value="Artificial Intelligence">Artificial Intelligence</option>
                    <option value="Biotechnology">Biotechnology</option>
                  </select>
                </div>

                <div>
                  <label for="editCourse" class="form-label">Course</label>
                  <input id="editCourse" name="editCourse" type="text" class="form-control" value="B.E. Computer Science" required />
                </div>

                <div>
                  <label for="editSemester" class="form-label">Semester</label>
                  <select id="editSemester" class="form-select" required>
                    <option value="6" selected>6</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                    <option value="7">7</option>
                    <option value="8">8</option>
                  </select>
                </div>

                <div>
                  <label for="editAdmissionDate" class="form-label">Admission Date</label>
                  <input id="editAdmissionDate" name="editAdmissionDate" type="date" class="form-control" value="2020-08-10" required />
                </div>

                <div class="full-width">
                  <label for="editAddress" class="form-label">Address</label>
                  <textarea id="editAddress" name="editAddress" class="form-control" rows="3" required>45 MG Road, Bengaluru</textarea>
                </div>

                <div>
                  <label for="editCity" class="form-label">City</label>
                  <input id="editCity" name="editCity" type="text" class="form-control" value="Bengaluru" required />
                </div>

                <div>
                  <label for="editState" class="form-label">State</label>
                  <input id="editState" name="editState" type="text" class="form-control" value="Karnataka" required />
                </div>

                <div>
                  <label for="editPincode" class="form-label">PIN Code</label>
                  <input id="editPincode" name="editPincode" type="text" class="form-control" value="560001" required />
                </div>
              </div>

              <div class="form-actions">
                <a href="student-details.html" class="btn btn-light">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>

    <div class="sidebar-overlay"></div>
    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
