<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System | Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="auth-layout">
      <div class="auth-card">
        <div class="auth-logo"><i class="bi bi-person-plus-fill"></i></div>
        <h1 class="auth-heading">Create Account</h1>
        <p class="auth-subtitle">Register to begin managing student records.</p>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input id="fullName" name="fullName" type="text" class="form-control" placeholder="Enter your full name" required />
          </div>

          <div class="mb-3">
            <label for="registerEmail" class="form-label">Email</label>
            <input id="registerEmail" name="email" type="email" class="form-control" placeholder="Enter your email address" required />
          </div>

          <div class="mb-3">
            <label for="registerPassword" class="form-label">Password</label>
            <div class="password-wrap">
              <input id="registerPassword" name="password" type="password" class="form-control" placeholder="Create a password" required />
              <button type="button" class="password-toggle" data-password-toggle data-target="registerPassword" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <div class="password-wrap">
              <input id="confirmPassword" name="confirmPassword" type="password" class="form-control" placeholder="Confirm your password" required />
              <button type="button" class="password-toggle" data-password-toggle data-target="confirmPassword" aria-label="Show password">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
        </form>

        <div class="auth-links">
          <span>Already have an account? <a href="login.html" class="text-primary fw-semibold">Login</a></span>
        </div>
      </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
